<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>掌柜智库 · 知识库问答</title>
<style>
  :root{
    --text:#1f2329;
    --muted:#8d93a1;
    --faint:#aab0bd;
    --line:#ececf1;
    --hover:#eceef4;
    --side-a:#f9f9fc;
    --side-b:#f3f4f9;
    --user-bubble:#eef1fb;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--text);background:#fff;
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  .app{display:flex;height:100vh;overflow:hidden}

  /* ============ 左侧栏：只有品牌 + 两个按钮 ============ */
  .sidebar{
    width:220px;flex:0 0 220px;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--side-a) 0%,var(--side-b) 100%);
    border-right:1px solid var(--line);
  }
  .side-head{display:flex;align-items:center;gap:8px;padding:14px 12px 12px}
  .brand-mark{
    width:24px;height:24px;border-radius:7px;background:#1f2329;color:#fff;
    display:grid;place-items:center;font-size:12px;font-weight:600;flex:0 0 auto;
  }
  .brand-text{display:flex;align-items:baseline;gap:5px;min-width:0}
  .brand-text strong{font-size:13.5px;font-weight:600;letter-spacing:.2px}
  .brand-text span{font-size:10px;color:var(--faint)}

  .side-actions{display:flex;flex-direction:column;gap:6px;padding:0 8px}
  .btn{
    display:flex;align-items:center;gap:9px;width:100%;height:36px;padding:0 11px;
    border:1px solid #e2e5ee;border-radius:9px;background:#fff;cursor:pointer;
    font-size:13px;font-weight:500;color:#2b303a;text-decoration:none;
    box-shadow:0 1px 2px rgba(19,26,45,.04);
    transition:border-color .15s,box-shadow .15s,background .15s;
  }
  .btn:hover{border-color:#cfd6e6;background:#fdfdff;box-shadow:0 2px 6px rgba(19,26,45,.08)}
  .btn:active{background:#f5f6fb;box-shadow:none}
  .btn svg{width:15px;height:15px;color:#4a5262;flex:0 0 auto}
  .btn .ext{margin-left:auto;display:flex;align-items:center;color:#b0b6c2}
  .btn .ext svg{width:12px;height:12px;color:currentColor}
  .btn.link{border-color:transparent;background:transparent;box-shadow:none;color:#333844;font-weight:400}
  .btn.link:hover{background:var(--hover);border-color:transparent;box-shadow:none}

  /* ============ 主区域 ============ */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:#fff}
  .scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 20px 0}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:#e2e4ec;border-radius:4px}
  .scroll::-webkit-scrollbar-thumb:hover{background:#d2d6e1}
  .thread{
    max-width:760px;margin:0 auto;padding:20px 4px 24px;
    display:flex;flex-direction:column;gap:26px;
  }

  .empty{max-width:620px;margin:16vh auto 0;text-align:center}
  .empty .logo-big{
    width:44px;height:44px;border-radius:12px;background:#1f2329;color:#fff;
    display:grid;place-items:center;margin:0 auto 16px;font-size:18px;font-weight:600;
  }
  .empty h1{font-size:21px;font-weight:600;margin:0;letter-spacing:.2px}

  /* 消息 */
  .msg{display:flex;gap:10px;align-items:flex-start}
  .msg .body{min-width:0;max-width:100%}
  .msg.bot .body{flex:1}
  .msg.user{justify-content:flex-end}
  .msg.user .body{max-width:86%}
  .msg.user .bubble{
    background:var(--user-bubble);color:#1f2329;border-radius:14px 14px 4px 14px;
    padding:10px 14px;font-size:14px;line-height:1.7;
    white-space:pre-wrap;overflow-wrap:break-word;max-width:100%;
  }
  .msg .avatar{
    width:26px;height:26px;flex:0 0 auto;border-radius:8px;margin-top:2px;
    background:#1f2329;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:500;
  }
  .client-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--faint);margin:3px 0 7px}
  .client-meta strong{font-size:13px;color:var(--text);font-weight:600}

  /* 正文排版 */
  .answer{font-size:14px;line-height:1.78;color:#24272e;overflow-wrap:break-word}
  .answer p{margin:0 0 10px}
  .answer p:last-child{margin-bottom:0}
  .answer h2,.answer h3,.answer h4,.answer h5{margin:18px 0 8px;font-weight:600;line-height:1.45;color:var(--text)}
  .answer h2{font-size:17px}
  .answer h3{font-size:15.5px}
  .answer h4{font-size:15px}
  .answer h5{font-size:14.5px}
  .answer ul,.answer ol{margin:6px 0 12px;padding-left:21px}
  .answer li{margin:4px 0}
  .answer strong{font-weight:600;color:#14171c}
  .answer blockquote{
    margin:10px 0;padding:7px 12px;border-left:3px solid #dfe1ea;
    background:#fafafd;color:#5b6475;border-radius:0 6px 6px 0;
  }
  .answer code.ic{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:#f2f3f7;border-radius:4px;padding:1px 5px;font-size:12.5px;color:#a33b2a;
  }
  .answer table{border-collapse:collapse;margin:12px 0;font-size:13px;width:100%;display:block;overflow-x:auto}
  .answer th,.answer td{border:1px solid #e8e9f0;padding:7px 10px;text-align:left;vertical-align:top}
  .answer th{background:#f7f8fb;font-weight:600;white-space:nowrap}
  .answer a{color:#3b5bdb;text-decoration:none}

  .code{margin:12px 0;border:1px solid #e9eaf0;border-radius:10px;overflow:hidden;background:#fafbfc}
  .code pre{
    margin:0;padding:12px;overflow-x:auto;font-size:12.5px;line-height:1.65;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#2b2f38;
  }

  .typing{display:inline-flex;gap:5px;align-items:center;height:20px}
  .typing i{width:5px;height:5px;border-radius:50%;background:#c2c7d3;animation:bnc 1.2s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes bnc{0%,80%,100%{transform:translateY(0);opacity:.55}40%{transform:translateY(-4px);opacity:1}}

  .answer-images{margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .answer-images img{
    display:block;max-width:min(100%,560px);max-height:460px;width:auto;height:auto;
    border-radius:10px;border:1px solid var(--line);background:#f7f8fb;
  }

  /* 输入区 */
  .composer-wrap{flex:0 0 auto;padding:0 20px 10px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 26%)}
  .composer{
    max-width:760px;margin:0 auto;background:#fff;border:1px solid #e6e8ef;border-radius:16px;
    padding:10px 12px 8px;box-shadow:0 6px 24px rgba(19,26,45,.06);
    transition:border-color .15s,box-shadow .15s;
  }
  .composer:focus-within{border-color:#cfd5e6;box-shadow:0 8px 28px rgba(19,26,45,.09)}
  #input{
    width:100%;border:none;outline:none;resize:none;background:transparent;
    font-family:inherit;font-size:14px;line-height:1.65;color:var(--text);
    min-height:24px;max-height:168px;padding:2px 2px 6px;
  }
  #input::placeholder{color:#a9aebb}
  .composer-bar{display:flex;align-items:center;justify-content:flex-end}
  .send{
    width:30px;height:30px;flex:0 0 auto;border-radius:50%;border:none;background:#1f2329;color:#fff;
    display:grid;place-items:center;cursor:pointer;transition:transform .12s,background .15s;
  }
  .send:hover{background:#000;transform:translateY(-1px)}
  .send:disabled{background:#d9dbe4;cursor:not-allowed;transform:none}
  .send svg{width:15px;height:15px}
  .disclaimer{max-width:760px;margin:8px auto 0;text-align:center;font-size:11px;color:#b3b8c4}

  @media (max-width:820px){
    .sidebar{display:none}
    .thread{padding-left:0;padding-right:0}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-head">
      <div class="brand-mark">掌</div>
      <div class="brand-text"><strong>掌柜智库</strong><span>v1.0</span></div>
    </div>

    <div class="side-actions">
      <button class="btn" id="btnNew" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        新建对话
      </button>

      <a class="btn link" id="btnUpload" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M8 8l4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        上传知识库
        <span class="ext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5"/><path d="M19 5l-8 8"/><path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/></svg></span>
      </a>
    </div>
  </aside>

  <main class="main">
    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="向掌柜智库提问…"></textarea>
        <div class="composer-bar">
          <button class="send" id="send" type="button" title="发送（Enter）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
          </button>
        </div>
      </div>
      <div class="disclaimer">内容由 AI 生成，请核实重要信息</div>
    </div>
  </main>
</div>

<script>
const IS_HTTP = location.protocol === 'http:' || location.protocol === 'https:';
const API_BASE = IS_HTTP ? location.origin : 'http://127.0.0.1:8001';
// 「上传知识库」指向导入服务 8000
const UPLOAD_URL = 'http://' + (IS_HTTP ? location.hostname : '127.0.0.1') + ':8000/front/import.html';
document.getElementById('btnUpload').href = UPLOAD_URL;

const scrollEl = document.getElementById('scroll');
const threadEl = document.getElementById('thread');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

let sessionId = '';
let busy = false;
let stickBottom = true;
let currentEs = null;
let gen = 0;   // 会话代次：切新对话后，旧请求的回包一律丢弃

/* ---------- 会话：一个全新的 session_id = 后端全新上下文 ---------- */
function genSessionId() {
  return 'sess-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
function startNewSession() {
  gen++;
  if (currentEs) { try { currentEs.close(); } catch (_) {} currentEs = null; }
  setBusy(false);
  sessionId = genSessionId();
  try { localStorage.setItem('kb_session_id', sessionId); } catch (_) {}
  threadEl.innerHTML = '';
  showEmpty();
  inputEl.focus();
}

/* ---------- 渲染工具 ---------- */
function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function isImageUrl(url) {
  try { return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(new URL(url).pathname); }
  catch (_) { return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || ''); }
}
function normalizeUrl(raw) { return String(raw || '').trim().replace(/\s/g, '%20'); }
function dedupe(arr) {
  const seen = new Set(), out = [];
  for (const x of (Array.isArray(arr) ? arr : [])) {
    const v = String(x || '');
    if (!v || seen.has(v)) continue;
    seen.add(v); out.push(v);
  }
  return out;
}
function lastImageMarker(raw) {
  const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
  let m, idx = -1, len = 0;
  while ((m = re.exec(String(raw || ''))) !== null) { idx = m.index; len = m[0].length; }
  return { idx, len };
}
/* 答案拆成「正文 + 图片」 */
function splitAnswer(raw) {
  const text0 = String(raw || '');
  const { idx, len } = lastImageMarker(text0);
  let text = text0, images = [];
  if (idx >= 0) {
    text = text0.slice(0, idx).trimEnd();
    for (const line of text0.slice(idx + len).split(/\r?\n/)) {
      const t = line.trim();
      if (!t) continue;
      const urls = t.match(/https?:\/\/[^\s]+/g) || [];
      urls.forEach(u => { if (isImageUrl(u)) images.push(normalizeUrl(u)); });
    }
  }
  const keep = [];
  for (const line of text.split('\n')) {
    const t = line.trim();
    if (/^https?:\/\/\S+$/.test(t)) { if (isImageUrl(t)) images.push(normalizeUrl(t)); continue; }
    keep.push(line);
  }
  return { text: keep.join('\n').replace(/\n{3,}/g, '\n\n').trim(), images: dedupe(images) };
}

/* ---------- 轻量 Markdown ---------- */
function splitRow(row) {
  let r = String(row).trim();
  if (r.startsWith('|')) r = r.slice(1);
  if (r.endsWith('|')) r = r.slice(0, -1);
  return r.split('|').map(x => x.trim());
}
function mdToHtml(src) {
  let s = escapeHtml(src || '');
  const codes = [];
  s = s.replace(/```([^\n`]*)\n([\s\S]*?)```/g, (_, lang, code) => {
    codes.push(code);
    return '\n\u0000C' + (codes.length - 1) + '\u0000\n';
  });
  s = s.replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');

  const lines = s.split('\n');
  const out = [];
  let para = [], list = null, table = null;
  const flushPara = () => { if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; } };
  const flushList = () => {
    if (!list) return;
    out.push('<' + list.tag + '>' + list.items.map(t => '<li>' + t + '</li>').join('') + '</' + list.tag + '>');
    list = null;
  };
  const flushTable = () => {
    if (!table) return;
    const head = '<tr>' + table.head.map(h => '<th>' + h + '</th>').join('') + '</tr>';
    const body = table.rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('');
    out.push('<table><thead>' + head + '</thead><tbody>' + body + '</tbody></table>');
    table = null;
  };
  const flushAll = () => { flushPara(); flushList(); flushTable(); };

  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    const codeM = t.match(/^\u0000C(\d+)\u0000$/);
    if (codeM) { flushAll(); out.push('<div class="code"><pre><code>' + codes[Number(codeM[1])] + '</code></pre></div>'); continue; }
    if (!t) { flushAll(); continue; }

    if (/^#{1,6}\s+/.test(t)) {
      flushAll();
      const m = t.match(/^(#{1,6})\s+(.*)$/);
      const lvl = Math.min(m[1].length + 1, 5);
      out.push('<h' + lvl + '>' + m[2] + '</h' + lvl + '>');
      continue;
    }
    if (t.startsWith('|') && i + 1 < lines.length) {
      const sep = lines[i + 1].trim();
      if (sep.startsWith('|') && /^[|\s:\-]+$/.test(sep) && sep.indexOf('-') >= 0) {
        flushAll();
        table = { head: splitRow(t), rows: [] };
        i++;
        while (i + 1 < lines.length && lines[i + 1].trim().startsWith('|')) {
          i++; table.rows.push(splitRow(lines[i].trim()));
        }
        flushTable(); continue;
      }
    }
    if (/^[-*+]\s+/.test(t)) {
      flushPara(); flushTable();
      if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; }
      list.items.push(t.replace(/^[-*+]\s+/, '')); continue;
    }
    if (/^\d+[.)]\s+/.test(t)) {
      flushPara(); flushTable();
      if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; }
      list.items.push(t.replace(/^\d+[.)]\s+/, '')); continue;
    }
    if (/^(&gt;|>)\s?/.test(t)) {
      flushAll(); out.push('<blockquote>' + t.replace(/^(&gt;|>)\s?/, '') + '</blockquote>'); continue;
    }
    flushList(); flushTable(); para.push(t);
  }
  flushAll();
  return out.join('');
}
function renderImages(images) {
  if (!images || !images.length) return '';
  return '<div class="answer-images">' + images.map(url =>
    '<img src="' + escapeHtml(url) + '" alt="参考图片" loading="lazy" referrerpolicy="no-referrer" />'
  ).join('') + '</div>';
}

/* ---------- 滚动 ---------- */
function nearBottom() { return scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 120; }
function scrollToBottom(force) { if (force || stickBottom) scrollEl.scrollTop = scrollEl.scrollHeight; }
let lastScrollTop = 0;
scrollEl.addEventListener('scroll', () => {
  const top = scrollEl.scrollTop;
  if (top < lastScrollTop - 4) stickBottom = false;
  if (nearBottom()) stickBottom = true;
  lastScrollTop = top;
});

/* ---------- 消息 ---------- */
function showEmpty() {
  threadEl.innerHTML =
    '<div class="empty">' +
      '<div class="logo-big">掌</div>' +
      '<h1>有什么可以帮你的？</h1>' +
    '</div>';
}

function addUserMsg(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg user';
  wrap.innerHTML = '<div class="body"><div class="bubble"></div></div>';
  wrap.querySelector('.bubble').textContent = text;
  threadEl.appendChild(wrap);
  scrollToBottom();
}

function createBotMsg() {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.innerHTML =
    '<div class="avatar">掌</div>' +
    '<div class="body">' +
      '<div class="client-meta"><strong>掌柜智库</strong><span class="st">正在生成</span></div>' +
      '<div class="answer"><span class="typing"><i></i><i></i><i></i></span></div>' +
    '</div>';
  threadEl.appendChild(wrap);
  scrollToBottom(true);

  const answerEl = wrap.querySelector('.answer');
  const stEl = wrap.querySelector('.st');
  let pendingText = null, rafId = 0;

  function paint() {
    rafId = 0;
    if (pendingText === null) return;
    const { text, images } = splitAnswer(pendingText);
    answerEl.innerHTML = mdToHtml(text) + renderImages(images);
    scrollToBottom();
  }
  function schedule(text) {
    pendingText = text;
    if (!rafId) rafId = requestAnimationFrame(paint);
  }

  return {
    setAnswer(text, streaming) {
      schedule(text || '');
      if (!streaming) {
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
        pendingText = text || '';
        paint();
        stEl.textContent = '已完成';
      }
    },
    fail(msg) {
      stEl.textContent = '失败';
      answerEl.innerHTML = '<p style="color:#c0392b">请求失败：' + escapeHtml(msg || '未知错误') + '</p>';
      scrollToBottom();
    }
  };
}

threadEl.addEventListener('error', (e) => {
  if (e.target && e.target.tagName === 'IMG') e.target.style.display = 'none';
}, true);
threadEl.addEventListener('load', (e) => {
  if (e.target && e.target.tagName === 'IMG' && stickBottom) scrollToBottom(true);
}, true);

/* ---------- 发送 ---------- */
function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 168) + 'px';
}
function setBusy(v) { busy = v; sendBtn.disabled = v; }

function streamSSE(taskId, bot, myGen) {
  return new Promise((resolve) => {
    let raw = '', settled = false;
    const finish = () => {
      if (settled) return;
      settled = true;
      try { if (currentEs) currentEs.close(); } catch (_) {}
      currentEs = null;
      resolve();
    };
    const es = new EventSource(API_BASE + '/stream/' + taskId);
    currentEs = es;

    es.addEventListener('delta', (e) => {
      if (myGen !== gen) return;
      try {
        const d = JSON.parse(e.data || '{}');
        if (d.delta) { raw += d.delta; bot.setAnswer(raw, true); }
      } catch (_) {}
    });
    const onFinal = (e) => {
      if (myGen !== gen) { finish(); return; }
      let txt = raw;
      try {
        const d = JSON.parse(e.data || '{}');
        if (d && typeof d.answer === 'string' && d.answer.trim()) txt = d.answer;
      } catch (_) {}
      bot.setAnswer(txt || '（已完成，但未返回内容）', false);
      finish();
    };
    es.addEventListener('final', onFinal);
    es.addEventListener('final_answer', onFinal);
    es.addEventListener('error', () => {
      if (settled) return;
      if (myGen === gen) {
        if (raw) bot.setAnswer(raw, false); else bot.fail('连接中断或超时，请重试');
      }
      finish();
    });
  });
}

async function onSend() {
  const text = (inputEl.value || '').trim();
  if (!text || busy) return;

  if (threadEl.querySelector('.empty')) threadEl.innerHTML = '';
  inputEl.value = '';
  autoGrow();
  stickBottom = true;
  setBusy(true);

  addUserMsg(text);
  const bot = createBotMsg();
  const myGen = gen;

  try {
    const res = await fetch(API_BASE + '/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: text, session_id: sessionId, is_stream: true })
    });
    if (myGen !== gen) return;
    if (!res.ok) throw new Error((await res.text()) || ('接口返回 ' + res.status));
    const data = await res.json();
    if (myGen !== gen) return;
    await streamSSE(data.task_id, bot, myGen);
  } catch (e) {
    if (myGen === gen) bot.fail(e.message || String(e));
  } finally {
    if (myGen === gen) { setBusy(false); inputEl.focus(); }
  }
}

document.getElementById('btnNew').addEventListener('click', startNewSession);
sendBtn.addEventListener('click', onSend);
inputEl.addEventListener('input', autoGrow);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); }
});

/* 启动：有存过的会话就把记录读回来，没有就开新的 */
async function loadHistory() {
  try {
    const res = await fetch(API_BASE + '/history/' + encodeURIComponent(sessionId));
    if (!res.ok) { showEmpty(); return; }
    const data = await res.json();
    const items = Array.isArray(data.items) ? data.items : [];
    if (!items.length) { showEmpty(); return; }
    threadEl.innerHTML = '';
    for (const item of items) {
      if (item.role === 'user') addUserMsg(item.text || '');
      else createBotMsg().setAnswer(item.text || '', false);
    }
    stickBottom = true;
    scrollToBottom(true);
  } catch (_) {
    showEmpty();
  }
}

sessionId = localStorage.getItem('kb_session_id') || '';
if (!sessionId) startNewSession();
else loadHistory();
setTimeout(() => inputEl.focus(), 150);
</script>
